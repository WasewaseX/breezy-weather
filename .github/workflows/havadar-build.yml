name: Havadar build

on:
  push:
    branches:
      - havadar/fa-main
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Assemble basic debug APK (fork build, no breezy config)
        id: assemble
        continue-on-error: true
        run: ./gradlew assembleBasicDebug --build-cache --stacktrace > build-output.txt 2>&1; echo "exit=$?" >> $GITHUB_OUTPUT

      - name: Collect error lines
        if: always()
        run: |
          set +e
          grep -E "^[0-9TZ:.-]+ (e: |w: file)" build-output.txt > build-errors.txt
          grep -E "FAILURE:|What went wrong|Caused by|error:" build-output.txt >> build-errors.txt
          echo "=== LAST 200 LINES ===" >> build-errors.txt
          tail -n 200 build-output.txt >> build-errors.txt
          wc -c build-errors.txt

      - name: Commit error snapshot (skip CI to avoid loops)
        if: always()
        run: |
          set +e
          git config user.email "bot@havadar.local"
          git config user.name "havadar-ci-bot"
          git add build-errors.txt
          git commit -m "CI error snapshot [skip ci]"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:havadar/fa-main"

      - name: Upload APK artifact
        if: steps.assemble.outputs.exit == '0'
        uses: actions/upload-artifact@v4
        with:
          name: havadar-debug-apk
          path: app/build/outputs/apk/basic/debug/*.apk
          if-no-files-found: error
